services:
  web:
    image: ${NODE01_IP:?Set NODE01_IP in .env, e.g. via controlplane-setup.sh}:5000/php-redis-counter:v1
    ports:
      - "8080:80"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    networks:
      - counter-net

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - counter-net

volumes:
  redis-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NODE01_IP:?Set NODE01_IP in .env},rw,nfsvers=4,nolock,soft"
      device: ":/srv/nfs/redis-data"

networks:
  counter-net:
    driver: bridge
