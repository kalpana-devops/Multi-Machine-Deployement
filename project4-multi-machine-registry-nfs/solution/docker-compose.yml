# Run on controlplane, after running controlplane-setup.sh (which writes
# the .env file this compose file reads NODE01_IP from).
#
# Unlike Projects 1–3, there is NO "nfs-server" service here — node01 is
# a genuinely separate machine, so there's nothing to simulate. Same
# reasoning for the image: "web" uses image:, not build:, because the
# image already lives in node01's registry.
services:
  web:
    image: ${NODE01_IP:?Set NODE01_IP in .env, e.g. via controlplane-setup.sh}:5000/php-redis-counter:v1
    ports:
      - "8080:80" # host:container -> port forwarding
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    networks:
      - counter-net

  redis:
    image: redis:7-alpine
    # NOTE: still no "ports:" here — Redis is only reachable from "web"
    # over the internal Docker network, same as every other project.
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - counter-net

volumes:
  redis-data:
    driver: local
    driver_opts:
      # addr points at node01's REAL IP address — a genuinely different
      # machine, not a container pretending to be one on a Docker network.
      type: nfs
      o: "addr=${NODE01_IP:?Set NODE01_IP in .env},rw,nfsvers=4,nolock,soft"
      device: ":/srv/nfs/redis-data"

networks:
  counter-net:
    driver: bridge
